[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "qldpc-certificate-benchmark"
dynamic = ["version"]
description = "Certified maximum-likelihood benchmarking of quantum error-correction decoders: prove, shot by shot, whether ML decoding succeeds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Michele Banfi", email = "michi.banfi01@gmail.com" }]
keywords = [
  "quantum error correction", "qLDPC", "decoder", "maximum likelihood",
  "benchmark", "certificate", "stim", "detector error model", "bivariate bicycle",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "numba>=0.58",
  "ldpc>=2.2",
]

[project.optional-dependencies]
stim = ["stim>=1.12"]
tesseract = ["stim>=1.12", "tesseract-decoder>=0.1.1.dev0"]
test = ["pytest>=7", "stim>=1.12"]
all = ["stim>=1.12", "tesseract-decoder>=0.1.1.dev0"]

[project.urls]
Homepage = "https://github.com/michelebanfi/qldpc-certificate-benchmark"
Repository = "https://github.com/michelebanfi/qldpc-certificate-benchmark"
Issues = "https://github.com/michelebanfi/qldpc-certificate-benchmark/issues"

[project.scripts]
qldpc-certificate-benchmark = "qldpc_certificate_benchmark.__main__:main"

[tool.hatch.version]
path = "src/qldpc_certificate_benchmark/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qldpc_certificate_benchmark"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running brute-force validation"]
